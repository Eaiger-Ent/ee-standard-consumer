  # --- Documentation -------------------------------------------------------

  - id: DOC-001
    title: Markdown conforms to one shared, pinned rule set
    enforces: >
      markdownlint-cli2 runs from a single configuration wired at editor,
      pre-commit and CI loci. Prose lines are capped at 250 characters
      (code blocks and tables exempt), matching the lint-md deployed
      config; narrowing-only variance permits tightening below 250 in a
      repo but never loosening above it.
    standard:
      name: markdownlint-cli2
      url: https://github.com/DavidAnson/markdownlint-cli2
    tier: 1
    rung: blocking
    locus: [editor, pre-commit, ci]
    applies_to: [always]
    deployed_by: lint-md
    verify:
      - kind: command
        # Not `npx`: it falls through to PATH (§ H6). An absent local install is
        # now `tool not installed — cannot verify` (UNCLASSIFIED, ADR 0016)
        # rather than a pass earned by a global nobody pinned.
        run: node_modules/.bin/markdownlint-cli2 "**/*.md"
      - kind: file
        # The ceiling, the tool name and the editor extension id are register
        # facts (ADR 0018): a repository may reasonably tighten the ceiling or
        # name a different editor without the checker changing. What the assert
        # holds is the shape — the ceiling may narrow but never widen, and all
        # three declared loci must be wired.
        assert: markdown_gate_wired_at_all_loci
        args:
          max_line_length: 250
          tool: markdownlint-cli2
          editor_extension: DavidAnson.vscode-markdownlint
    owner: platform-engineering
    variance: narrowing-only
    baseline: null
    review_by: 2027-08-16
    rationale_adr: https://github.com/Eaiger-Ent/ee-standard/blob/main/docs/adr/0013-one-markdown-rule-set.md

# ---------------------------------------------------------------------------
# Meta-controls. These do not check the code — they check the register and its
# enforcement. Without them the register can rot silently: a control can be
# declared blocking and be unreachable, a baseline can grow, an expiry can pass.
# ---------------------------------------------------------------------------
meta_controls:

  - id: GOV-001
    title: Every blocking control is reachable from a CI step that can fail
    enforces: >
      For each control with `rung: blocking` and `ci` in its locus, a CI step
      exists that invokes its verification and is not marked continue-on-error.
    rationale: >
      A control declared blocking but unreachable is worse than no control —
      it reports safety that does not exist. This is theme T-3 from the
      predecessor retrospective.
    verify:
      - kind: command
        run: register-check meta GOV-001
        # The `partial:` this block carried from contract 3 is gone at contract
        # 26, because the thing it declared unverified is now read. Two
        # questions hid inside "is it required", and contract 19 separated
        # them: whether the *repository* says the job is required, which the
        # recorded ruleset answers from a file, and whether *GitHub* enforces
        # that ruleset, which no file can answer. GOV-001 now asks the platform
        # the second one and fails a required check GitHub does not enforce —
        # a recorded ruleset nobody was told about protects nothing.
        #
        # Removing a partial is not the same act as satisfying it, so it is
        # worth saying which happened: the property is verified, not waived.
        # Without a token the meta-control reports SKIPPED (no credentials) and
        # says what it did verify, which still denies the run a `0` (ADR 0016).

  - id: GOV-002
    title: No baseline grew
    enforces: >
      Every baseline artefact has the same or fewer entries than at the
      previous commit on the default branch.
    rationale: >
      The baseline's size is the burndown metric. A baseline that may grow is
      an exemption list, not a migration.
    verify:
      - kind: command
        run: register-check meta GOV-002

  - id: GOV-003
    title: No control is past its review date
    enforces: >
      No control in this register has a `review_by` earlier than today.
    rationale: >
      An unreviewed control drifts from the standard it claims to enforce.
      Expiry forces the re-decision rather than letting silence stand in
      for agreement.
    verify:
      - kind: command
        run: register-check meta GOV-003
